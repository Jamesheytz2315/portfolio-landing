<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[YOUR NAME] | Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--accent:#C6FF3D;--ink:#0E0E12;--card:#1A1A22;--line:#2E2E3A;--cream:#F4F1EA;--muted:#C9C6BE}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--cream);font-family:'DM Sans',system-ui,sans-serif}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
h1,h3,.display{font-family:'Bricolage Grotesque',sans-serif;font-weight:800}
.page{min-height:100vh;padding:28px 32px 36px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:24px}
.top{width:100%;max-width:1200px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center}
.logo{font-size:24px;letter-spacing:-.5px}.logo span{color:var(--accent)}
.hint{font-size:15px;color:var(--muted)}
.hero{text-align:center}
h1{margin:0;font-size:clamp(40px,6vw,80px);line-height:1;letter-spacing:-2px}
h1 em{font-style:normal;color:var(--accent)}
.hero p{margin:16px auto 0;font-size:19px;line-height:1.5;max-width:520px;color:var(--muted)}
.row{width:100%;max-width:1200px;display:flex;flex-wrap:wrap;gap:20px;justify-content:center}
.obj{flex:1 1 220px;max-width:270px;min-height:230px;background:var(--card);border:1.5px solid var(--line);border-radius:28px;padding:24px;color:inherit;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:16px;cursor:pointer;transition:transform .2s,border-color .2s}
.obj:hover{transform:translateY(-8px) rotate(0)!important;border-color:var(--cream)}
.obj:focus-visible,.cta:focus-visible{outline:3px solid var(--cream);outline-offset:3px}
.o1{transform:rotate(-3deg)}.o2{transform:rotate(2deg) translateY(14px)}.o3{transform:rotate(-2deg)}.o4{transform:rotate(3deg) translateY(14px)}
.art{margin-top:26px}
.label{text-align:center}.label b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:22px;font-weight:800}
.label small{font-size:14px;color:var(--muted)}
.music{background:var(--accent);border-color:var(--accent);color:var(--ink);align-items:stretch;text-align:left}
.music:hover{border-color:var(--cream)}
.m-top{display:flex;justify-content:space-between;align-items:flex-end;margin-top:8px}
.cover{width:92px;height:92px;border-radius:18px;background:var(--ink);display:flex;align-items:center;justify-content:center}
.m-bot{display:flex;justify-content:space-between;align-items:center;gap:12px}
.m-bot b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:22px;font-weight:800}
.m-bot small{font-size:14px;font-weight:500}
.pp{width:44px;height:44px;border-radius:50%;background:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.eq{display:flex;align-items:flex-end;gap:4px;height:44px}
.eq span{width:6px;height:8px;border-radius:3px;background:var(--ink);animation:eq .9s ease-in-out infinite;animation-play-state:paused}
.eq.run span{animation-play-state:running}
.eq span:nth-child(2){animation-delay:.15s}.eq span:nth-child(3){animation-delay:.3s}.eq span:nth-child(4){animation-delay:.45s}.eq span:nth-child(5){animation-delay:.6s}
.cta{display:inline-flex;align-items:center;gap:12px;background:var(--cream);color:var(--ink);padding:18px 40px;border-radius:999px;font-weight:700;font-size:19px;transition:transform .2s}
.cta:hover{transform:scale(1.05)}
@keyframes lift{0%,100%{transform:translateY(0)}40%{transform:translateY(-26px) rotate(-4deg)}}
@keyframes throw{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(36px,-58px) rotate(200deg)}100%{transform:translate(0,0) rotate(360deg)}}
@keyframes eq{0%,100%{height:8px}50%{height:44px}}
@keyframes press{50%{transform:scale(.9)}}
.lifting{animation:lift .6s ease}.throwing{animation:throw .8s ease}.pressing{animation:press .25s ease}
@media (prefers-reduced-motion:reduce){.lifting,.throwing,.pressing,.eq span{animation:none}}
</style>
</head>
<body>
<div class="page">
  <div class="top"><span class="display logo">[YOUR NAME]<span>.</span></span><span class="hint">[YOUR ROLE] · tap the objects</span></div>
  <div class="hero">
    <h1>Lift. Listen. <em>Play.</em> Repeat.</h1>
    <p>Music, flag football, fitness and games fuel everything I make. [ONE LINE ABOUT WHAT YOU DO.]</p>
  </div>
  <div class="row">
    <button class="obj o1" id="dumb" aria-label="Dumbbell: tap to lift a rep">
      <div class="art" id="dumbArt"><svg viewBox="0 0 200 100" width="190" height="95" aria-hidden="true">
        <rect x="40" y="46" width="120" height="8" rx="3" fill="#9A97A0"/>
        <g fill="#C6FF3D"><rect x="14" y="32" width="12" height="36" rx="3"/><rect x="26" y="20" width="14" height="60" rx="4"/><rect x="174" y="32" width="12" height="36" rx="3"/><rect x="160" y="20" width="14" height="60" rx="4"/></g></svg></div>
      <div class="label"><b>Fitness</b><small>Reps: <span id="reps">0</span></small></div>
    </button>
    <button class="obj o2" id="ball" aria-label="Football: tap to throw">
      <div class="art" id="ballArt"><svg viewBox="0 0 200 120" width="190" height="114" aria-hidden="true"><g transform="rotate(-20 100 60)">
        <ellipse cx="100" cy="60" rx="82" ry="44" fill="#B5532F"/>
        <g stroke="#F4F1EA" fill="none"><path d="M44 24 Q36 60 44 96" stroke-width="5"/><path d="M156 24 Q164 60 156 96" stroke-width="5"/>
        <path d="M70 60H130M82 52V68M94 52V68M106 52V68M118 52V68" stroke-width="4"/></g></g></svg></div>
      <div class="label"><b>Flag football</b><small>Touchdowns: <span id="tds">0</span></small></div>
    </button>
    <button class="obj o3 music" id="music" aria-label="Music card: tap to play or pause">
      <div class="m-top"><div class="cover"><svg viewBox="0 0 24 24" width="44" height="44" aria-hidden="true"><path d="M9 18V6l10-2v12" fill="none" stroke="#C6FF3D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="7" cy="18" r="2.5" fill="#C6FF3D"/><circle cx="17" cy="16" r="2.5" fill="#C6FF3D"/></svg></div>
        <div class="eq" id="eq"><span></span><span></span><span></span><span></span><span></span></div></div>
      <div class="m-bot"><div><b>[YOUR SONG]</b><small>[ARTIST] · <span id="plabel">Paused</span></small></div>
        <div class="pp"><svg id="iPlay" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M7 4l13 8-13 8z" fill="#C6FF3D"/></svg>
        <svg id="iPause" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="display:none"><rect x="6" y="5" width="4" height="14" fill="#C6FF3D"/><rect x="14" y="5" width="4" height="14" fill="#C6FF3D"/></svg></div></div>
    </button>
    <button class="obj o4" id="pad" aria-label="Game controller: tap to press buttons">
      <div class="art" id="padArt"><svg viewBox="0 0 200 120" width="190" height="114" aria-hidden="true">
        <path d="M52 28h96q34 0 42 52 4 32-20 32-16 0-26-22h-88q-10 22-26 22-24 0-20-32 8-52 42-52z" fill="#3A3A48"/>
        <rect x="52" y="54" width="32" height="10" rx="3" fill="#F4F1EA"/><rect x="63" y="43" width="10" height="32" rx="3" fill="#F4F1EA"/>
        <circle class="b" cx="146" cy="46" r="8"/><circle class="b" cx="160" cy="60" r="8"/><circle class="b" cx="146" cy="74" r="8"/><circle class="b" cx="132" cy="60" r="8"/></svg></div>
      <div class="label"><b>Games</b><small>Button: <span id="pname">press me</span></small></div>
    </button>
  </div>
  <a class="cta" href="https://YOUR-PORTFOLIO-URL">Enter my portfolio
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="#0E0E12" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
</div>
<script>
const $ = (id) => document.getElementById(id);
function pulse(el, cls, ms){ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); setTimeout(() => el.classList.remove(cls), ms); }
let reps = 0, tds = 0, playing = false, pad = -1;
$('dumb').onclick = () => { $('reps').textContent = ++reps; pulse($('dumbArt'), 'lifting', 650); };
$('ball').onclick = () => { $('tds').textContent = ++tds; pulse($('ballArt'), 'throwing', 850); };
$('music').onclick = () => {
  playing = !playing;
  $('eq').classList.toggle('run', playing);
  $('plabel').textContent = playing ? 'Playing' : 'Paused';
  $('iPlay').style.display = playing ? 'none' : '';
  $('iPause').style.display = playing ? '' : 'none';
};
const cols = ['#C6FF3D', '#FF6B4A', '#4DD8FF', '#FFC93D'], names = ['A', 'B', 'X', 'Y'];
const dots = document.querySelectorAll('#pad .b');
function paint(){ dots.forEach((d, i) => d.setAttribute('fill', i === pad ? cols[i] : '#6A6A7A')); }
paint();
$('pad').onclick = () => { pad = (pad + 1) % 4; paint(); $('pname').textContent = names[pad]; pulse($('padArt'), 'pressing', 300); };
</script>
</body>
</html>
